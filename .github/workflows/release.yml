name: Release

# Releases are built only from version tags, on GitHub-hosted runners, in the
# same pinned container as CI (ADR 0004). Each release gets the .nro, its
# SHA-256 checksum and a build-provenance attestation.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the release .nro
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"
            exit 1
          fi
      - name: Build
        run: make -j "$(nproc)"
      - name: Checksum
        run: sha256sum dreadovania.nro | tee dreadovania.nro.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dreadovania.nro
            dreadovania.nro.sha256
          if-no-files-found: error

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # Sigstore OIDC for the attestation
      attestations: write  # build-provenance attestation
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Build provenance attestation (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dreadovania.nro
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Install"
            echo
            echo "Copy \`dreadovania.nro\` to \`/switch/\` on your SD card and open it from the Homebrew Menu."
            echo
            echo "Check the download before you copy it:"
            echo
            echo '```bash'
            echo "gh attestation verify dreadovania.nro --repo ${GH_REPO}"
            echo '```'
            echo
          } > notes.md
          gh release create "${TAG}" dreadovania.nro dreadovania.nro.sha256 \
            --verify-tag --title "${TAG}" --notes-file notes.md --generate-notes

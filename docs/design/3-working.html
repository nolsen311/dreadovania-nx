<!doctype html><!-- SPDX-License-Identifier: GPL-3.0-or-later --><html><head><meta charset="utf-8"><link rel="stylesheet" href="mockups.css"></head><body><div class="screen"><header class="top"><img src="icon.svg" alt=""><span class="title">Dreadovania</span><span class="server"><span class="dot"></span>dread.home.example.com</span></header>
<main style="grid-template-columns: 1fr">
  <section class="section" style="padding: 40px 120px; gap: 28px">
    <h2>Getting your new seed</h2>
    <div class="steps">
      <div class="step done"><span class="mark">✓</span><span>Generate</span><span class="muted small">Kraid Pulse Morph</span></div>
      <div class="step done"><span class="mark">✓</span><span>Patch with your game files</span><span class="muted small">on the server</span></div>
      <div class="step now"><span class="mark">3</span><span>Download and check</span><span class="muted small">14.2 of 25.1 MB</span></div>
      <div class="step later"><span class="mark">4</span><span>Install</span><span></span></div>
    </div>
    <div class="bar"><i style="width: 57%"></i></div>
    <div class="muted small">Every file is checked before anything on the SD card changes.</div>
  </section>
</main>
<footer class="bottom"><span class="left">Keep the app open</span>
  <span class="btn"><span class="glyph">B</span>Stop waiting (the server carries on)</span></footer>
</div></body></html>
